name: build-and-test

on:
  push:
    branches: [main]
    tags: ['v*']        # e.g. v0.1.0 -> full matrix + GitHub Release
  pull_request:
  workflow_dispatch:

# Build the odata loadable extension against DuckDB core and run the HTTP
# end-to-end tests with the official duckdb CLI of the same version.
#
# Design choice (see docs/design.md): the extension does NOT vendor DuckDB as
# a git submodule. CI clones the pinned DuckDB source per job so the build
# version can be matrixed and the extension repo stays small.
#
# The matrix is expanded explicitly per (os, duckdb_version, platform) so the
# DuckDB platform ABI (linux_amd64 / osx_amd64 / osx_arm64) is part of the
# artifact name and the e2e CLI is downloaded for the same ABI.
# Note: GitHub-hosted `macos-latest` is arm64; `macos-13` provides an Intel
# runner for osx_amd64 builds. Windows is not in the matrix yet (the v0.1 HTTP
# server is POSIX-only).

jobs:
  build-and-test:
    name: odata ${{ matrix.duckdb_version }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # v1.5.5: build + e2e on every ABI
          - { os: ubuntu-latest, duckdb_version: v1.5.5, platform: linux_amd64, cli_asset: duckdb_cli-linux-amd64.zip, run_e2e: true }
          - { os: [self-hosted,macOS,X64],      duckdb_version: v1.5.5, platform: osx_amd64,   cli_asset: duckdb_cli-osx-amd64.zip,   run_e2e: true }
          - { os: macos-latest,  duckdb_version: v1.5.5, platform: osx_arm64,   cli_asset: duckdb_cli-osx-arm64.zip,   run_e2e: true }
          # v1.4.3: same coverage (official CLIs are published for all ABIs)
          - { os: ubuntu-latest, duckdb_version: v1.4.3, platform: linux_amd64, cli_asset: duckdb_cli-linux-amd64.zip, run_e2e: true }
          - { os: [self-hosted,macOS,X64],      duckdb_version: v1.4.3, platform: osx_amd64,   cli_asset: duckdb_cli-osx-amd64.zip,   run_e2e: true }
          - { os: macos-latest,  duckdb_version: v1.4.3, platform: osx_arm64,   cli_asset: duckdb_cli-osx-arm64.zip,   run_e2e: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DuckDB source (${{ matrix.duckdb_version }})
        run: |
          DUCKDB_DIR_VERSION="${DUCKDB_VERSION#v}"   # v1.5.5 -> 1.5.5
          mkdir -p .dev
          curl -fL --retry 3 -o /tmp/duckdb.tar.gz \
            "https://github.com/duckdb/duckdb/archive/refs/tags/${DUCKDB_VERSION}.tar.gz"
          tar -xzf /tmp/duckdb.tar.gz -C .dev
          mv ".dev/duckdb-${DUCKDB_DIR_VERSION}" .dev/duckdb
        env:
          DUCKDB_VERSION: ${{ matrix.duckdb_version }}

      - name: Configure DuckDB build with the odata extension
        run: |
          # OVERRIDE_GIT_DESCRIBE pins the DuckDB version the extension footer
          # claims. The source tarball has no .git, so without it DuckDB's CMake
          # falls back to the dummy version "v0.0.1" and the produced extension
          # cannot be LOADed by the official CLI of the pinned version.
          cmake -B .dev/duckdb/build -S .dev/duckdb \
            -DCMAKE_BUILD_TYPE=Release \
            -DOVERRIDE_GIT_DESCRIBE="${{ matrix.duckdb_version }}" \
            -DDUCKDB_EXTENSION_CONFIGS="${{ github.workspace }}/extension_config.cmake"

      - name: Build loadable extension
        run: |
          cmake --build .dev/duckdb/build --target odata_loadable_extension
          ls -la .dev/duckdb/build/extension/odata/odata.duckdb_extension

      - uses: actions/upload-artifact@v4
        with:
          name: odata-${{ matrix.duckdb_version }}-${{ matrix.platform }}
          path: .dev/duckdb/build/extension/odata/odata.duckdb_extension
          if-no-files-found: error

      # HTTP e2e downloads the official duckdb CLI for the same ABI and LOADs
      # the just-built extension with -unsigned.
      - name: Download official duckdb CLI (${{ matrix.duckdb_version }}-${{ matrix.platform }})
        if: matrix.run_e2e
        run: |
          mkdir -p cli
          curl -fL --retry 3 -o cli/duckdb_cli.zip \
            "https://github.com/duckdb/duckdb/releases/download/${{ matrix.duckdb_version }}/${{ matrix.cli_asset }}"
          unzip -o cli/duckdb_cli.zip -d cli
          chmod +x cli/duckdb
          ./cli/duckdb --version

      - name: Run HTTP end-to-end tests
        if: matrix.run_e2e
        run: |
          DUCKDB_CLI="$(find "${{ github.workspace }}/cli" -maxdepth 1 -type f -name 'duckdb*' -perm -u+x | head -1)"
          test -n "$DUCKDB_CLI"
          python3 test/http/odata_http_test.py \
            "$DUCKDB_CLI" \
            "${{ github.workspace }}/.dev/duckdb/build/extension/odata/odata.duckdb_extension"

  # Publish a GitHub Release from a version tag (e.g. v0.1.0). Waits for the
  # full build/test matrix, then renames every uploaded artifact to
  # odata-<duckdb_version>-<platform>.duckdb_extension and attaches them
  # (plus a sha256 manifest) to the tag's release.
  release:
    name: Release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: odata-*

      - name: Stage release assets
        run: |
          set -euo pipefail
          cd release-assets
          assets=()
          for d in odata-*; do
            test -d "$d" || continue
            test -f "$d/odata.duckdb_extension" || continue
            cp "$d/odata.duckdb_extension" "${d}.duckdb_extension"
            assets+=("${d}.duckdb_extension")
          done
          test "${#assets[@]}" -gt 0   # fail loudly when nothing was built
          sha256sum "${assets[@]}" > sha256sums.txt
          printf '%s\n' "${assets[@]}" > /tmp/assets.txt
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t assets < /tmp/assets.txt
          args=("${assets[@]}" sha256sums.txt)

          notes=/tmp/release-notes.md
          {
            echo "# duckdb-odata ${RELEASE_TAG}"
            echo
            echo "Loadable DuckDB extensions for each supported DuckDB version / ABI."
            echo "Load with the matching official duckdb CLI using \`-unsigned\`:"
            echo
            echo "\`\`\`sql"
            echo "LOAD '/path/to/odata-v1.5.5-linux_amd64.duckdb_extension';"
            echo "\`\`\`"
            echo
            echo "| Asset | DuckDB CLI | Platform |"
            echo "| --- | --- | --- |"
            for a in "${assets[@]}"; do
              rest="${a#odata-}"; rest="${rest%.duckdb_extension}"
              ver="${rest%%-*}"; plat="${rest#*-}"
              echo "| \`$a\` | ${ver} | ${plat} |"
            done
            echo
            echo "Checksums: \`sha256sums.txt\`. Quick start: [README](https://github.com/cn00/duckdb-odata/blob/main/README.md)."
          } > "$notes"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # rerun of a partially created release: refresh notes and assets
            gh release edit "$RELEASE_TAG" --title "duckdb-odata ${RELEASE_TAG}" --notes-file "$notes"
            gh release upload "$RELEASE_TAG" "${args[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${args[@]}" \
              --title "duckdb-odata ${RELEASE_TAG}" \
              --notes-file "$notes"
          fi

      - name: Show uploaded assets
        run: ls -la release-assets/*.duckdb_extension release-assets/sha256sums.txt
